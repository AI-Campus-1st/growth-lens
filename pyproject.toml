# GrowthLens 프로젝트 메타데이터
# 의존성은 팀 승인 후 추가합니다. (docs/architecture/system_architecture.md 의 '미결정 사항' 참고)
[project]
name = "growthlens"
version = "0.0.1"
description = "네이버 스마트스토어 소규모 판매자를 위한 커머스·마케팅 의사결정 지원 플랫폼"
readme = "README.md"
requires-python = ">=3.11"   # 제안값 — 팀 확인 필요
dependencies = []            # 승인 전 비워 둠

[project.optional-dependencies]
dev = []                     # pytest, ruff 등 — 승인 후 추가

[tool.ruff]                  # 린터 도입 시 사용할 제안 설정 (ruff 미설치)
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
